# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.debug=false

# ModDevGradle properties
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Mod properties
mod_id=stockpile
mod_name=Stockpile
mod_license=MIT
mod_version=1.0.0
mod_description=A Minecraft mod inspired by Silent Gear, adding tiered weapons and armor using base game materials
mod_authors=Lille
mod_credits=Inspired by Silent Gear

# Minecraft and NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neoforge_version=21.1.57
neoforge_version_range=[21,)

# Dependencies
loader_version_range=[4,)